<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chokdee POS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2430;--mute:#5b6675;--line:#d5dbe3;--accent:#f2b705;--ok:#1f9d55;--danger:#d62828;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--card:#1d2631;--ink:#eef1f4;--mute:#9aa6b5;--line:#2c3746;--ok:#3ecf82;--danger:#ff7a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a22;--card:#1d2631;--ink:#eef1f4;--mute:#9aa6b5;--line:#2c3746;--ok:#3ecf82;--danger:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Prompt,"Noto Sans Thai",sans-serif;background-color:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.mute{color:var(--mute)}.c{text-align:center}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:var(--bg);position:sticky;top:0;z-index:5}
.top b{font-size:20px;margin-right:auto;color:var(--accent)}
.top button{background:transparent;color:inherit;border-color:transparent}
.top button.on{background:var(--accent);color:#1b2430;font-weight:700}
.app{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px;align-items:start}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{white-space:nowrap;border-radius:99px}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;min-height:120px;border-radius:14px}
.item:active{transform:scale(.97);border-color:var(--accent)}
.em{font-size:34px}.nm{font-weight:500;text-align:center}.pr{color:var(--mute)}
.cart{background:var(--card);border:1px solid var(--line);border-radius:16px;position:sticky;top:70px;display:flex;flex-direction:column;max-height:calc(100vh - 90px)}
.cart header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
#lines{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:120px}
#lines li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
#lines small{display:block;color:var(--mute)}.empty{display:block!important;color:var(--mute);text-align:center;padding:28px 16px!important}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:40px;padding:0}
.foot{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.sum{display:flex;justify-content:space-between;font-size:26px;font-weight:700}
.btn{background:var(--accent);border-color:var(--accent);color:#1b2430;font-weight:700;width:100%}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ghost{width:100%}
main{display:block}main[hidden]{display:none}
.pad{padding:16px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stats b{display:block;font-size:24px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-width:0 0 1px;border-radius:0;text-align:left}
label{display:grid;gap:4px;margin-bottom:10px;color:var(--mute);font-size:14px}
input,select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(440px,94vw);padding:18px;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tabs2 .on{background:var(--ink);color:var(--bg)}
.qr{background:#fff;padding:12px;border-radius:14px;width:fit-content;margin:8px auto}
.big{font-size:30px;font-weight:700;margin:6px 0}.err{color:var(--danger)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.rc{font-family:ui-monospace,monospace;font-size:14px}.rc hr{border:0;border-top:1px dashed var(--mute)}
.rc p,.rc div.l{display:flex;justify-content:space-between;margin:2px 0}
#bar{display:none}
@media(max-width:899px){
 .app{grid-template-columns:1fr;padding-bottom:110px}
 .cart{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:16px 16px 0 0;max-height:75vh;transform:translateY(calc(100% - 118px - env(safe-area-inset-bottom,0px)));transition:transform .25s;z-index:6}
 .cart.open{transform:none}
 #bar{display:block}
}
@media(prefers-reduced-motion:reduce){.cart{transition:none}}
@media print{.top,main,#bar{display:none!important}dialog{position:static;border:0;width:100%;box-shadow:none}.noprint{display:none!important}}
#sub{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}#sub[hidden]{display:none}#sub button{white-space:nowrap;border-radius:99px}#sub .on{background:var(--ink);color:var(--bg)}
#login{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}#login[hidden]{display:none}.lg{width:min(380px,100%)}
.bars{display:flex;gap:3px;height:140px;margin-top:10px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}.bars i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}.bars small{font-size:10px;color:var(--mute)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
@media print{#sub,#login{display:none!important}}
/* ===== v3: ธีมแดง-ขาว ตัวอักษรดำ ล็อกเป็นโหมดสว่างตามแบรนด์ ===== */
[hidden]{display:none!important}
:root{--bg:#f5f5f6;--card:#fff;--ink:#111;--mute:#555;--line:#e1e1e4;--accent:#c8102e;--ok:#1a8f4d;--danger:#c8102e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f5f5f6;--card:#fff;--ink:#111;--mute:#555;--line:#e1e1e4;--ok:#1a8f4d;--danger:#c8102e;color-scheme:light}}
:root[data-theme="dark"]{--bg:#f5f5f6;--card:#fff;--ink:#111;--mute:#555;--line:#e1e1e4;--ok:#1a8f4d;--danger:#c8102e;color-scheme:light}
body{font-family:"Noto Sans Thai",Prompt,sans-serif;color:var(--ink);background:var(--bg)}
.top{background:var(--accent);color:#fff;height:64px;padding:0 16px}.top b{color:#fff;font-size:20px;letter-spacing:.5px}
.top button{border:1px solid rgba(255,255,255,.65);color:#fff;background:transparent}#burger{font-size:22px;padding:0 12px}
.btn,.btn.ok{color:#fff}.btn{background:var(--accent);border-color:var(--accent)}
.chip.on,.tabs2 .on{background:var(--accent);border-color:var(--accent);color:#fff}
.pr{color:var(--accent);font-weight:600}.item:active,.item:hover{border-color:var(--accent)}
.cart header{background:var(--accent);color:#fff;border-radius:16px 16px 0 0}.cart header .mute{color:#ffd9de}#tot{color:var(--accent)}
.stats div:first-child{background:var(--accent);color:#fff;border-color:var(--accent)}.stats div:first-child .mute{color:#ffd9de}
.pad{max-width:1100px;margin:0 auto}
#sub{position:fixed;left:0;top:64px;bottom:0;width:248px;flex-direction:column;gap:2px;overflow-y:auto;padding:12px;background:#fff;border:0;border-right:1px solid var(--line);z-index:7;transform:translateX(-100%);transition:transform .2s}
#sub button{width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;color:var(--ink);font-weight:500;white-space:normal}
#sub button.on{background:var(--accent);color:#fff}
body.nav-open #sub{transform:none}
body:not(.admin) #sub,body:not(.admin) #burger{display:none}
@media(min-width:900px){body.admin #sub{transform:none}body.admin main{margin-left:248px}#burger{display:none}}
@media(prefers-reduced-motion:reduce){#sub{transition:none}}
.lg{padding:0;overflow:hidden}.lg .lh{background:var(--accent);color:#fff;padding:20px}.lg .lb{padding:18px}
.tabrow{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}.tabrow button{white-space:nowrap;border-radius:99px}.tabrow .on{background:var(--accent);border-color:var(--accent);color:#fff}
.op{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:16px;padding:6px 0}.op input{width:22px;height:22px;padding:0;flex:none}
fieldset.og{border:1px solid var(--line);border-radius:12px;margin:0 0 12px}fieldset.og legend{font-weight:600;padding:0 6px}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;color:inherit}
.sub{display:flex;flex-direction:column;gap:2px;margin:0 0 8px 18px;padding-left:10px;border-left:2px solid var(--line)}
#sub .sub button{padding:9px 12px;font-size:15px}#sub button.cur{font-weight:700;color:var(--accent)}#sub .chev{flex:none;color:var(--mute)}
.imgbox{display:flex;gap:12px;align-items:center;margin:8px 0 12px}.imgbox img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.th{width:36px;height:36px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:6px}
.item .em img{width:88px;height:88px;object-fit:cover;border-radius:12px;display:block}
</style>
</head>
<body>
<div class="top"><b>Chokdee POS</b><span id="who"></span><button data-v="sell" class="on">หน้าร้าน</button><button data-v="bo">หลังบ้าน</button><button id="out">ออกจากระบบ</button></div>
<nav id="sub" hidden><button data-g="dash" class="on">Dashboard</button><button data-g="menu">จัดการเมนู</button><button data-g="stock">สต๊อก</button><button data-g="rep">รายงาน</button><button data-g="set">ตั้งค่า</button></nav>
<div id="login"><div class="card lg"><b style="font-size:22px">Chokdee POS</b><p class="mute" id="lg-t">เข้าสู่ระบบด้วยรหัสร้าน</p><label id="lg-nl" hidden>ชื่อร้าน<input id="lg-name"></label><label>รหัสร้าน<input id="lg-code" autocapitalize="characters" autocomplete="username"></label><label>รหัสผ่าน (อย่างน้อย 4 ตัว)<input id="lg-pin" type="password" autocomplete="current-password"></label><p class="err" id="lg-err" role="alert"></p><button class="btn" id="lg-go">เข้าสู่ระบบ</button><button class="ghost" id="lg-sw" style="margin-top:8px">สร้างร้านใหม่</button></div></div>

<main id="v-sell"><div class="app">
 <section><div class="chips" id="chips"></div><div class="grid" id="grid"></div></section>
 <aside class="cart" id="cart">
  <header id="cartbar"><b>บิลปัจจุบัน</b><span class="mute" id="cnt">0 รายการ</span></header>
  <ul id="lines"></ul>
  <div class="foot"><div class="sum"><span>รวม</span><span id="tot">฿0</span></div>
   <button class="btn" id="pay" disabled>ชำระเงิน</button><button class="ghost" id="clear">ล้างบิล</button></div>
 </aside></div></main>

<main id="v-orders" hidden><div class="pad"><div class="stats" id="stats"></div><div class="card" style="margin-top:14px"><b>รายการบิลวันนี้</b><div id="olist"></div></div></div></main>

<main id="v-set" hidden><div class="pad">
 <div class="card" id="cardApi"><b>เชื่อมต่อ API ชำระเงิน</b><p class="mute">โหมดสาธิตจำลอง QR และการจ่ายเงิน ส่วนโหมดใช้งานจริงจะเรียก API ของคุณ</p>
  <label>โหมด<select id="c-mode"><option value="demo">สาธิต (ไม่เรียก API จริง)</option><option value="live">ใช้งานจริง</option></select></label>
  <label>ชื่อร้าน (แสดงบนใบเสร็จ)<input id="c-shop"></label>
  <label>Base URL<input id="c-base" placeholder="https://api.example.com"></label>
  <div class="two"><label>Path สร้าง QR (POST)<input id="c-create"></label><label>Path เช็กสถานะ (GET)<input id="c-status"></label></div>
  <label>API Token (ถ้ามี)<input id="c-token" type="password"></label>
  <button class="btn" id="c-save">บันทึกการตั้งค่า</button></div>
 <div class="card" id="cardMenu"><b>จัดการเมนู</b><div id="mlist"></div>
  <div class="two" style="margin-top:12px"><label>ชื่อเมนู<input id="m-name"></label><label>ราคา (บาท)<input id="m-price" type="number" min="0" inputmode="decimal"></label></div>
  <div class="two"><label>หมวด<input id="m-cat" placeholder="เช่น เครื่องดื่ม"></label><label>ไอคอน (อิโมจิ)<input id="m-em" maxlength="4"></label></div>
  <button class="btn" id="m-add">เพิ่มเมนู</button></div>
</div></main>

<main id="v-stock" hidden><div class="pad" id="stockp"></div></main>
<main id="v-rep" hidden><div class="pad" id="repp"></div></main>
<main id="v-adm" hidden><div class="pad" id="admp"></div></main>
<div id="bar"></div>
<dialog id="dlg"></dialog>

<script>
/* ---------- storage ---------- */
const $=s=>document.querySelector(s);
let NS='';const store={get(k,d){try{const v=localStorage.getItem(NS+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){}}};
const DEF=[["เบอร์เกอร์","🍔","เบอร์เกอร์หมู",49],["เบอร์เกอร์","🍔","เบอร์เกอร์ไก่",55],["เบอร์เกอร์","🧀","ชีสเบอร์เกอร์",69],["ไก่ทอด","🍗","ไก่ทอด 1 ชิ้น",39],["ไก่ทอด","🍗","ไก่ทอด 3 ชิ้น",109],["เครื่องเคียง","🍟","เฟรนช์ฟรายส์",35],["เครื่องเคียง","🧅","หอมทอด",39],["เครื่องดื่ม","🥤","โค้ก",20],["เครื่องดื่ม","🧋","ชาเย็น",30],["เครื่องดื่ม","💧","น้ำดื่ม",10],["เซ็ต","🍱","เซ็ตเบอร์เกอร์+ฟรายส์+น้ำ",99]].map((r,i)=>({id:'m'+i,cat:r[0],em:r[1],name:r[2],price:r[3]}));
let menu=store.get('menu',JSON.parse(JSON.stringify(DEF))),orders=store.get('orders',[]);
let cfg=Object.assign({mode:'demo',shop:'ร้านสปีดฟู้ด',base:'',token:'',createPath:'/qr',statusPath:'/payments'},store.get('cfg',{}));
let cart=[],cat='ทั้งหมด',timer=null,demoPaid=false;
const fmt=n=>'฿'+Number(n).toLocaleString('th-TH',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toDateString();
const todays=()=>orders.filter(o=>new Date(o.time).toDateString()===today());

/* ---------- API adapter: ปรับตรงนี้ให้ตรงกับ API จริงของคุณ ---------- */
const api={
 headers(){return Object.assign({'Content-Type':'application/json'},cfg.token?{Authorization:'Bearer '+cfg.token}:{})},
 // ส่ง {orderId, amount, currency} -> คาดหวัง {ref, qrPayload} หรือ {ref, qrImage}
 async create(p){
  if(cfg.mode==='demo')return{ref:p.orderId,qrPayload:'DEMO-PAY|'+p.orderId+'|'+p.amount.toFixed(2)};
  const r=await fetch(cfg.base+cfg.createPath,{method:'POST',headers:this.headers(),body:JSON.stringify(p)});
  if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
 },
 // คาดหวัง {status:'paid'|'pending'|'expired'}
 async status(ref){
  if(cfg.mode==='demo')return{status:demoPaid?'paid':'pending'};
  const r=await fetch(cfg.base+cfg.statusPath+'/'+encodeURIComponent(ref),{headers:this.headers()});
  if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
 }
};

/* ---------- menu + cart ---------- */
function renderMenu(){
 const cats=['ทั้งหมด',...new Set(menu.map(m=>m.cat))];
 $('#chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
 $('#grid').innerHTML=menu.filter(m=>cat==='ทั้งหมด'||m.cat===cat).map(m=>`<button class="item" data-id="${m.id}"><span class="em">${esc(m.em||'🍽️')}</span><span class="nm">${esc(m.name)}</span><span class="pr">${fmt(m.price)}</span></button>`).join('')||'<p class="mute">ยังไม่มีเมนู เพิ่มได้ที่หน้าตั้งค่า</p>';
}
const total=()=>cart.reduce((s,l)=>s+l.price*l.qty,0);
function renderCart(){
 const n=cart.reduce((s,l)=>s+l.qty,0);
 $('#lines').innerHTML=cart.map(l=>`<li><div><b>${esc(l.name)}</b><small>${fmt(l.price)}</small></div><div class="qty"><button data-a="-" data-id="${l.id}" aria-label="ลดจำนวน">−</button><span>${l.qty}</span><button data-a="+" data-id="${l.id}" aria-label="เพิ่มจำนวน">+</button></div><b>${fmt(l.price*l.qty)}</b></li>`).join('')||'<li class="empty">แตะเมนูเพื่อเริ่มบิลใหม่</li>';
 $('#tot').textContent=fmt(total());$('#cnt').textContent=n+' รายการ';$('#pay').disabled=!n;$('#clear').disabled=!n;
}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){cat=b.dataset.c;renderMenu()}};
$('#grid').onclick=e=>{const b=e.target.closest('.item');if(!b)return;const m=menu.find(x=>x.id===b.dataset.id);if(!m)return;const l=cart.find(x=>x.id===m.id);l?l.qty++:cart.push({id:m.id,name:m.name,price:m.price,qty:1});renderCart()};
$('#lines').onclick=e=>{const b=e.target.closest('button');if(!b)return;const l=cart.find(x=>x.id===b.dataset.id);if(!l)return;l.qty+=b.dataset.a==='+'?1:-1;if(l.qty<1)cart=cart.filter(x=>x!==l);renderCart()};
$('#clear').onclick=()=>{cart=[];renderCart()};
$('#cartbar').onclick=()=>$('#cart').classList.toggle('open');

/* ---------- payment ---------- */
const stopPoll=()=>{clearInterval(timer);timer=null};
$('#dlg').addEventListener('close',stopPoll);
$('#pay').onclick=()=>{
 $('#dlg').innerHTML=`<div class="dh"><b>ชำระเงิน</b><button data-close>ปิด</button></div><div class="tabs2"><button class="on" data-m="qr">QR พร้อมเพย์</button><button data-m="cash">เงินสด</button></div><div id="pb"></div>`;
 $('#dlg').showModal();payQR();
};
async function payQR(){
 stopPoll();demoPaid=false;const t=total(),pb=$('#pb');
 pb.innerHTML='<p class="mute c">กำลังสร้าง QR…</p>';
 const orderId='B'+Date.now().toString().slice(-8);
 try{
  const r=await api.create({orderId,amount:t,currency:'THB'});
  pb.innerHTML=`<div class="qr" id="qr"></div><p class="c big">${fmt(t)}</p><p class="mute c" id="st">รอลูกค้าสแกนจ่าย…</p>${cfg.mode==='demo'?'<button class="btn" id="sim">จำลองว่าลูกค้าจ่ายแล้ว</button>':''}`;
  if(r.qrImage){const i=new Image();i.src=r.qrImage;i.width=i.height=220;i.alt='QR';$('#qr').append(i)}
  else if(window.QRCode)new QRCode($('#qr'),{text:String(r.qrPayload),width:220,height:220});

/* รายงาน */
PG.rep=t=>{
 const ui=t==='log'?'':`<div class="two" style="margin-bottom:12px"><label>ตั้งแต่<input type="date" id="rf" value="${rp.f}"></label><label>ถึง<input type="date" id="rto" value="${rp.to}"></label></div>`;
 const os=orders.filter(o=>{const k=ymd(o.time);return k>=rp.f&&k<=rp.to}),ok=os.filter(o=>!o.cancelled),G={};
 const add=(k,b,q,s)=>{const g=G[k]||(G[k]=[0,0,0]);g[0]+=b;g[1]+=q;g[2]+=s};
 const catOf=l=>(menu.find(m=>m.id===(l.mid||l.id))||{}).cat||'อื่นๆ';
 const L=f=>ok.forEach(o=>o.items.forEach(f));
 if(t==='sum')ok.forEach(o=>add(ymd(o.time),1,0,o.total));
 if(t==='pay')ok.forEach(o=>add(o.method,1,0,o.total));
 if(t==='product')L(l=>add(l.name,0,l.qty,l.price*l.qty));
 if(t==='cat')L(l=>add(catOf(l),0,l.qty,l.price*l.qty));
 if(t==='grp')L(l=>add((cats.find(c=>c.name===catOf(l))||{}).group||'ไม่ระบุกลุ่ม',0,l.qty,l.price*l.qty));
 let body;
 if(t==='bills')body=billRows(os);
 else if(t==='orders')body=os.length?tbl(['เวลา','บิล','รายการ','จำนวน','ยอด'],os.flatMap(o=>o.items.map(l=>[dt(o.time),'#'+String(o.no).padStart(4,'0')+(o.cancelled?' (ยกเลิก)':''),esc(l.name),l.qty,fmt(l.price*l.qty)])).reverse()):none;
 else if(t==='log')body=alog.length?tbl(['เวลา','ผู้ใช้','รายการ'],alog.map(a=>[dt(a.t),a.w,esc(a.m)])):none;
 else{const bill=t==='sum'||t==='pay',rows=Object.entries(G).sort((a,b)=>t==='sum'?a[0].localeCompare(b[0]):b[1][2]-a[1][2]),tot=ok.reduce((s,o)=>s+o.total,0);
  body=rows.length?tbl(bill?['รายการ','บิล','ยอดขาย','เฉลี่ย/บิล']:['รายการ','จำนวน','ยอดขาย'],rows.map(([k,g])=>bill?[esc(k),g[0],fmt(g[2]),fmt(g[2]/g[0])]:[esc(k),g[1],fmt(g[2])]).concat([bill?['<b>รวม</b>',ok.length,'<b>'+fmt(tot)+'</b>','']:['<b>รวม</b>','','<b>'+fmt(rows.reduce((s,r)=>s+r[1][2],0))+'</b>']])):none}
 return ui+`<div class="card" style="overflow-x:auto">${body}</div>`;
};

const done=(m)=>{if(m)log(m);sv();renderAdm();renderMenu()};
const mv=(s,d,note)=>{slog.unshift({t:new Date().toISOString(),item:s.name,d,q:s.qty,note});slog.length=Math.min(slog.length,500)};
const A={
 tab:i=>{tab[view]=i;ed={};renderAdm()},cancel:()=>{ed={};renderAdm()},
 edit_item:i=>{ed.item=i;renderAdm();$('#admp').lastElementChild.scrollIntoView()},
 save_item:()=>{const name=V('i-name').trim(),p=V('i-price');if(!name||p==='')return;
  const o={name,price:+p,cat:V('i-cat')||'อื่นๆ',em:V('i-em').trim(),groups:[...document.querySelectorAll('.ig:checked')].map(i=>i.value)};
  if(ed.item)Object.assign(menu.find(x=>x.id===ed.item),o);else menu.push({id:'m'+Date.now(),...o});ed={};done((ed.item?'แก้ไข':'เพิ่ม')+'เมนู '+name)},
 copy_item:i=>{const m=menu.find(x=>x.id===i);menu.push({...m,id:'m'+Date.now(),name:m.name+' (สำเนา)'});done('คัดลอกเมนู '+m.name)},
 tg_item:i=>{const m=menu.find(x=>x.id===i);m.off=!m.off;done((m.off?'ปิดขาย ':'เปิดขาย ')+m.name)},
 del_item:i=>{const m=menu.find(x=>x.id===i);menu=menu.filter(x=>x!==m);done('ลบเมนู '+m.name)},
 edit_cat:i=>{ed.cat=i;renderAdm()},
 save_cat:()=>{const n=V('c-name').trim(),g=V('c-grp').trim();if(!n||cats.some(k=>k.name===n&&k.id!==ed.cat))return;

 copy_cat:i=>{const c=cats.find(x=>x.id===i),n=c.name+' (สำเนา)';cats.push({id:'c'+Date.now(),name:n,group:c.group});menu.filter(m=>m.cat===c.name).forEach((m,j)=>menu.push({...m,id:'m'+Date.now()+j,cat:n}));done('คัดลอกหมวดหมู่ '+c.name)},
 del_cat:i=>{const c=cats.find(x=>x.id===i);cats=cats.filter(x=>x!==c);if(menu.some(m=>m.cat===c.name)){if(!cats.some(k=>k.name==='อื่นๆ'))cats.push({id:'c'+Date.now(),name:'อื่นๆ',group:''});menu.forEach(m=>{if(m.cat===c.name)m.cat='อื่นๆ'})}done('ลบหมวดหมู่ '+c.name)},
 edit_grp:i=>{ed.grp=i;renderAdm()},
 save_grp:()=>{const name=V('g-name').trim(),options=V('g-opts').split('\n').map(s=>s.trim()).filter(Boolean).map((s,i)=>{const [n,p]=s.split(',');return{id:'o'+i,name:n.trim(),price:+p||0}});if(!name||!options.length)return;
  const id=ed.grp||'g'+Date.now(),o={id,name,min:+V('g-min')||0,max:+V('g-max')||0,options};
  if(ed.grp)Object.assign(groups.find(x=>x.id===id),o);else groups.push(o);

 del_grp:i=>{groups=groups.filter(g=>g.id!==i);menu.forEach(m=>m.groups=(m.groups||[]).filter(x=>x!==i));done('ลบกลุ่มตัวเลือก')},
 edit_ing:i=>{ed.ing=i;renderAdm()},

  if(ed.ing)Object.assign(stock.find(x=>x.id===ed.ing),o);else{const s={id:'s'+Date.now(),qty:+V('s-qty')||0,...o};stock.push(s);if(s.qty)mv(s,s.qty,'ยอดตั้งต้น')}ed={};done('บันทึกวัตถุดิบ '+name)},
 del_ing:i=>{const s=stock.find(x=>x.id===i);stock=stock.filter(x=>x!==s);done('ลบวัตถุดิบ '+s.name)},

  const d=t==='add'?q:t==='sub'?-q:q-s.qty,n=+(s.qty+d).toFixed(2);if(n<0&&!S.stock.neg){$('#a-e').textContent='ยอดติดลบไม่ได้ (ปรับได้ที่ ตั้งค่าสต๊อก)';return}
  s.qty=n;mv(s,+d.toFixed(2),V('a-n'));done('ปรับสต๊อก '+s.name+' ('+(d>0?'+':'')+d+')')},
 edit_sc:i=>{ed.sc=i;renderAdm()},
 save_sc:()=>{const n=V('sc-name').trim();if(!n||scats.some(k=>k.name===n&&k.id!==ed.sc))return;

 const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);
 try{
  const r=await fetch((cfg.base||'').replace(/\/$/,'')+path,{method:'POST',headers:Object.assign({'Content-Type':'application/json; charset=utf-8'},(CLOUD?TOKEN:cfg.token)?{Authorization:'Bearer '+(CLOUD?TOKEN:cfg.token)}:{}),body:JSON.stringify(body),signal:c.signal});

  return j;
 }catch(e){if(e.status===undefined){e.status=0;e.message=e.name==='AbortError'?'หมดเวลา (10 วินาที)':'เชื่อมต่อ Gateway ไม่ได้ (ตรวจ Base URL / CORS / เครือข่าย)'}throw e}

async function call(path,body){
 const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:body?JSON.stringify(body):undefined});
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok){const e=new Error((j&&j.detail)||('HTTP '+r.status));e.status=r.status;throw e}
 return j;

async function flush(){
 if(!CLOUD||!TOKEN||!pushQ.size)return;
 const batch=new Map(pushQ);pushQ.clear();const kv={},os=[];
 for(const [k,v] of batch){if(k==='orders'){for(const o of orders)if(sentOrders.get(o.time)!==JSON.stringify(o))os.push(o)}else kv[k]=v}
 try{
  const r=await call('/api/push',{kv,orders:os}),rej=new Map((r.rejected||[]).map(x=>[x.id,x.why]));
  for(const o of os){if(rej.get(o.time)==='dup_ref'){orders=orders.filter(x=>x.time!==o.time);_rawSet.call(store,'orders',orders)}else sentOrders.set(o.time,JSON.stringify(o))}
  setSync('☁ บันทึกแล้ว');
 }catch(e){
  if(e.status===401){cloudExpired();return}
  for(const [k,v] of batch)if(!pushQ.has(k))pushQ.set(k,v);
  setSync('⚠ ออฟไลน์ (จะลองใหม่)');clearTimeout(syncT);syncT=setTimeout(flush,5000);
 }
}

const mergePend=(a,b)=>{const m=new Map();for(const p of [...a,...b]){const o=m.get(p.id);if(!o||RANK[p.st]>=RANK[o.st])m.set(p.id,{...(o||{}),...p})}return[...m.values()].sort((x,y)=>x.t-y.t)};
const mergeLog=(a,b,n)=>{const m=new Map();for(const x of [...a,...b])m.set(x.t+'|'+(x.m||x.item),x);return[...m.values()].sort((x,y)=>y.t<x.t?-1:1).slice(0,n)};
function applyState(s){
 for(const [k,row] of Object.entries(s.kv)){
  if(pushQ.has(k))continue;let v;try{v=JSON.parse(row.v)}catch(e){continue}
  if(k==='menu')menu=v;else if(k==='cats')cats=v;else if(k==='groups')groups=v;else if(k==='stock')stock=v;else if(k==='scats')scats=v;
  else if(k==='S'){const sd=SD();S={};for(const x in sd)S[x]=Array.isArray(sd[x])?(v[x]||sd[x]):Object.assign(sd[x],v[x])}
  else if(k==='cfg'){const keep={token:cfg.token,base:cfg.base};cfg=Object.assign(cfg,v,keep)}
  else if(k==='alog')alog=mergeLog(alog,v,300);else if(k==='slog')slog=mergeLog(slog,v,500);else if(k==='qrpend')qrpend=mergePend(qrpend,v);
  _rawSet.call(store,k,{menu,cats,groups,stock,scats,S,cfg,alog,slog,qrpend}[k]);
 }
 const loc=new Map(orders.map(o=>[o.time,o]));
 for(const o of s.orders){const mine=loc.get(o.time);if(!mine||sentOrders.get(o.time)===JSON.stringify(mine)){loc.set(o.time,o);sentOrders.set(o.time,JSON.stringify(o))}}
 orders=[...loc.values()].sort((a,b)=>a.time<b.time?-1:1);_rawSet.call(store,'orders',orders);
}

async function shrink(file,size=256){
 const url=URL.createObjectURL(file);
 try{
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('อ่านไฟล์รูปไม่ได้'));i.src=url});
  const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,size,size);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,size,size);
  return c.toDataURL('image/jpeg',0.82);
 }finally{URL.revokeObjectURL(url)}
}
